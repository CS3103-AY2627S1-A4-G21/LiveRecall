<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    #live {
      height: calc(18rem + 9px);
      box-sizing: content-box;
      overflow-y: auto;
      overflow-wrap: anywhere;
      border: 1px solid #bbb;
      border-radius: .4rem;
      padding: 1rem;
      margin: 1rem 0;
    }
    .naive-line {
      line-height: 1.5rem;
      padding: .35rem 0;
      border-bottom: 1px dotted #ddd;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .caption-provisional {
      color: #64748b;
      font-style: italic;
    }
    .caption-final {
      color: #0f172a;
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 0.25rem;
      letter-spacing: 0.04em;
      font-style: normal;
      flex-shrink: 0;
    }
    .badge-provisional {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .badge-final {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .caption-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      font-style: normal;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .caption-text {
      flex: 1;
    }
    button { padding: .55rem .75rem; margin: .2rem; }
    #recall { white-space: pre-wrap; margin-top: 1rem; border-left: 3px solid #ccc; padding-left: 1rem; }
    .hint { font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <div id="live"></div>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">Select “What did I miss?” to view recent finalized captions.</div>
  <script src="app.js"></script>
</body>
</html>
